baseURL = "https://gptnews.github.io/"
theme = "PaperMod"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false

enableInlineShortcodes = true
enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false

[pagination]
  pagerSize = 10

[params]
[params.homeInfoParams]
  Title = "🐋 Crypto Whale Watch"
  Content = "Monitoring crypto whales, smart money movements, daily signals and reports on large fund flows."
  env = "production"
  author = "Whale Watch Analytics"
  defaultTheme = "auto"
  ShowShareButtons = false
  ShowReadingTime = true
  ShowPostNavLinks = false
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true
  comments = false
  hidemeta = false
  hideSummary = false
  showtoc = true
  tocopen = false

[languages.en]
  languageCode = "en"
  languageName = "English"
  title = "Crypto Whale Watch"
  weight = 1
  [languages.en.params]
    description = "Crypto whale monitoring, on-chain analysis, daily trading signals"
  [languages.en.menu]
    [[languages.en.menu.main]]
      identifier = "categories"
      name = "Categories"
      url = "/categories/"
      weight = 10
    [[languages.en.menu.main]]
      identifier = "tags"
      name = "Tags"
      url = "/tags/"
      weight = 20
    [[languages.en.menu.main]]
      identifier = "search"
      name = "Search"
      url = "/search/"
      weight = 30
    [[languages.en.menu.main]]
      identifier = "telegram"
      name = "Telegram"
      url = "https://t.me/forex_signals_fast"
      weight = 40

[languages.ru]
  languageCode = "ru"
  languageName = "Русский"
  title = "Crypto Whale Watch"
  weight = 2
  [languages.ru.params]
    description = "Мониторинг криптокитов, анализ on-chain, ежедневные сигналы"
  [languages.ru.menu]
    [[languages.ru.menu.main]]
      identifier = "categories"
